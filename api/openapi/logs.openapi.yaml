openapi: 3.0.3
info:
  title: MyCloudDrive Logs API
  version: 1.0.0
  description: 日志域接口契约（spec-first）。
servers:
  - url: /
tags:
  - name: Logs
    description: 日志域接口契约（spec-first）。
paths:
  /apis/logs/login/pages:
    get:
      tags:
        - 日志管理
      summary: 分页获取登录日志列表
      operationId: getPages_2
      parameters:
        - name: qry
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LoginLogPageQry"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultSysLoginLogVO"
components:
  schemas:
    LoginLogPageQry:
      type: object
      properties:
        page:
          type: integer
          format: int32
          description: 页码
          example: 1
          minimum: 1
        pageSize:
          type: integer
          format: int32
          description: 每页大小
          example: 20
          minimum: 1
        orderBy:
          type: string
          description: 排序字段
          example: updateTime
        orderDirection:
          type: string
          description: 排序方向
          enum:
          - ASC
          - DESC
          example: DESC
        keyword:
          type: string
        status:
          type: integer
          format: int32
    PageRecordSysLoginLogVO:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SysLoginLogVO'
        total:
          type: integer
          format: int64
    PageResultSysLoginLogVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/PageRecordSysLoginLogVO'
    SysLoginLogVO:
      type: object
      description: 登录日志
      properties:
        id:
          type: integer
          format: int64
          description: id
        userId:
          type: string
          description: 用户ID
        username:
          type: string
          description: 用户名
        loginIp:
          type: string
          description: 登录IP地址
        loginAddress:
          type: string
          description: 登录地址
        browser:
          type: string
          description: 浏览器
        os:
          type: string
          description: 操作系统
        status:
          type: integer
          format: int32
          description: 状态
        msg:
          type: string
          description: 错误信息
        loginTime:
          type: string
          format: date-time
          description: 最后登录时间
