openapi: 3.0.1
info:
  title: MyCloudDrive Share API
  description: 分享域接口契约（Go 风格命名）。
  version: 1.0.0
tags:
  - name: 文件分享
paths:
  /apis/share/verify/code:
    post:
      summary: 验证提取码
      deprecated: false
      description: 验证提取码
      operationId: verifyShareCode
      tags:
        - 文件分享
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyShareCodeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultBoolean'
          headers: {}
      security: []
  /apis/share/create:
    post:
      summary: 创建分享
      deprecated: false
      description: 创建分享
      operationId: createShare
      tags:
        - 文件分享
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileShareResponse'
          headers: {}
      security: []
  /apis/share/{shareId}:
    get:
      summary: 获取分享详细信息
      deprecated: false
      description: 获取分享详细信息
      operationId: getShareDetail
      tags:
        - 文件分享
      parameters:
        - name: shareId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileShareResponse'
          headers: {}
      security: []
  /apis/share/{shareId}/items:
    get:
      summary: 获取分享页文件列表数据
      deprecated: false
      description: 获取分享页文件列表数据
      operationId: getShareItems
      tags:
        - 文件分享
      parameters:
        - name: shareId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
        - name: parentId
          in: query
          description: ''
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultListFileResponse'
          headers: {}
      security: []
  /apis/share/{shareId}/info:
    get:
      summary: 获取分享页数据
      deprecated: false
      description: 获取分享页数据
      operationId: getShareInfo
      tags:
        - 文件分享
      parameters:
        - name: shareId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileShareThinResponse'
          headers: {}
      security: []
  /apis/share/{shareId}/download/{fileId}:
    get:
      summary: 分享内文件下载
      deprecated: false
      description: 分享内文件下载
      operationId: downloadShareFile
      tags:
        - 文件分享
      parameters:
        - name: shareId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
        - name: fileId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
          headers: {}
      security: []
  /apis/share/{shareId}/access/records:
    get:
      summary: 获取分享访问记录列表
      deprecated: false
      description: 获取分享访问记录列表
      operationId: getAccessRecords
      tags:
        - 文件分享
      parameters:
        - name: shareId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultListFileShareAccessRecordResponse'
          headers: {}
      security: []
  /apis/share/pages:
    get:
      summary: 获取我的分享
      deprecated: false
      description: 分页获取我的分享列表
      operationId: listMyShares
      tags:
        - 文件分享
      parameters:
        - name: page
          in: query
          description: 页码
          required: false
          example: 1
          schema:
            type: integer
            format: int32
            description: 页码
            minimum: 1
            example: 1
        - name: pageSize
          in: query
          description: 每页大小
          required: false
          example: 20
          schema:
            type: integer
            format: int32
            description: 每页大小
            minimum: 1
            example: 20
        - name: orderBy
          in: query
          description: 排序字段
          required: false
          example: updateTime
          schema:
            type: string
            description: 排序字段
            example: updateTime
        - name: orderDirection
          in: query
          description: 排序方向
          required: false
          example: DESC
          schema:
            type: string
            description: 排序方向
            enum:
              - ASC
              - DESC
            example: DESC
        - name: keyword
          in: query
          description: ''
          required: false
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResultFileShareResponse'
          headers: {}
      security: []
  /apis/share/clears:
    delete:
      summary: 全部取消分享
      deprecated: false
      description: 全部取消
      operationId: cancelAllShares
      tags:
        - 文件分享
      parameters: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileShareResponse'
          headers: {}
      security: []
  /apis/share/cancels:
    delete:
      summary: 取消分享
      deprecated: false
      description: 取消分享
      operationId: cancelShares
      tags:
        - 文件分享
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileShareResponse'
          headers: {}
      security: []
components:
  schemas:
    VerifyShareCodeRequest:
      type: object
      properties:
        shareId:
          type: string
          minLength: 1
        shareCode:
          type: string
          minLength: 1
      required:
        - shareCode
        - shareId
    ResultBoolean:
      type: object
      properties:
        data:
          type: boolean
        code:
          type: integer
          format: int32
        msg:
          type: string
    CreateShareRequest:
      type: object
      properties:
        fileIds:
          type: array
          items:
            type: string
          minItems: 1
        shareName:
          type: string
        expireType:
          type: integer
          format: int32
        expireTime:
          type: string
          format: date-time
        scope:
          type: string
        needShareCode:
          type: boolean
        maxViewCount:
          type: integer
          format: int32
        maxDownloadCount:
          type: integer
          format: int32
      required:
        - fileIds
    FileShareResponse:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
        storageSettingId:
          type: string
        storageSettingName:
          type: string
        shareName:
          type: string
        shareCode:
          type: string
        expireTime:
          type: string
          format: date-time
        scope:
          type: string
        isPermanent:
          type: boolean
        viewCount:
          type: integer
          format: int32
        downloadCount:
          type: integer
          format: int32
        maxViewCount:
          type: integer
          format: int32
        maxDownloadCount:
          type: integer
          format: int32
        fileCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    ResultFileShareResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FileShareResponse'
        code:
          type: integer
          format: int32
        msg:
          type: string
    FileShareThinResponse:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
        storageSettingId:
          type: string
        storageSettingName:
          type: string
        shareName:
          type: string
        expireTime:
          type: string
          format: date-time
        scope:
          type: string
        isExpire:
          type: boolean
        fileCount:
          type: integer
          format: int64
        hasCheckCode:
          type: boolean
    FileResponse:
      type: object
      properties:
        id:
          type: string
        objectKey:
          type: string
        originalName:
          type: string
        displayName:
          type: string
        suffix:
          type: string
        size:
          type: integer
          format: int64
        mimeType:
          type: string
        isDir:
          type: boolean
        parentId:
          type: string
        userId:
          type: string
        thumbnailUrl:
          type: string
        uploadTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
        lastAccessTime:
          type: string
          format: date-time
        isFavorite:
          type: boolean
    ResultFileShareThinResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FileShareThinResponse'
        code:
          type: integer
          format: int32
        msg:
          type: string
    ResultListFileResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileResponse'
        code:
          type: integer
          format: int32
        msg:
          type: string
    FileShareAccessRecordResponse:
      type: object
      properties:
        id:
          type: string
        shareId:
          type: string
        accessIp:
          type: string
        accessAddress:
          type: string
        browser:
          type: string
        os:
          type: string
        accessTime:
          type: string
          format: date-time
    ResultListFileShareAccessRecordResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileShareAccessRecordResponse'
        code:
          type: integer
          format: int32
        msg:
          type: string
    PageRecordFileShareResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/FileShareResponse'
        total:
          type: integer
          format: int64
    PageResultFileShareResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/PageRecordFileShareResponse'
  responses: {}
  securitySchemes: {}
servers: []
security: []
