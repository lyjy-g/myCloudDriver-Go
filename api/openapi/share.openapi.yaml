openapi: 3.0.3
info:
  title: MyCloudDrive Share API
  version: 1.0.0
  description: 分享域接口契约（spec-first）。
servers:
  - url: /
tags:
  - name: Share
    description: 分享域接口契约（spec-first）。
paths:
  /apis/share/verify/code:
    post:
      tags:
        - 文件分享
      summary: 验证提取码
      description: 验证提取码
      operationId: verifyShareCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyShareCodeCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultBoolean"
  /apis/share/create:
    post:
      tags:
        - 文件分享
      summary: 创建分享
      description: 创建分享
      operationId: createDirectory_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultFileShareVO"
  /apis/share/{shareId}:
    get:
      tags:
        - 文件分享
      summary: 获取分享详细信息
      description: 获取分享详细信息
      operationId: getDetail_1
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultFileShareVO"
  /apis/share/{shareId}/items:
    get:
      tags:
        - 文件分享
      summary: 获取分享页文件列表数据
      description: 获取分享页文件列表数据
      operationId: getShareFileItems
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
        - name: parentId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListFileVO"
  /apis/share/{shareId}/info:
    get:
      tags:
        - 文件分享
      summary: 获取分享页数据
      description: 获取分享页数据
      operationId: getFileShareThin
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultFileShareThinVO"
  /apis/share/{shareId}/download/{fileId}:
    get:
      tags:
        - 文件分享
      summary: 分享内文件下载
      description: 分享内文件下载
      operationId: downloadShareFile
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /apis/share/{shareId}/access/records:
    get:
      tags:
        - 文件分享
      summary: 获取分享访问记录列表
      description: 获取分享访问记录列表
      operationId: getListByShareId
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListFileShareAccessRecordVO"
  /apis/share/pages:
    get:
      tags:
        - 文件分享
      summary: 获取我的分享
      description: 分页获取我的分享列表
      operationId: getPages
      parameters:
        - name: qry
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FileShareQry"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultFileShareVO"
  /apis/share/clears:
    delete:
      tags:
        - 文件分享
      summary: 全部取消分享
      description: 全部取消
      operationId: cancelAllShares
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultFileShareVO"
  /apis/share/cancels:
    delete:
      tags:
        - 文件分享
      summary: 取消分享
      description: 取消分享
      operationId: cancelShares
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultFileShareVO"
components:
  schemas:
    VerifyShareCodeCmd:
      type: object
      properties:
        shareId:
          type: string
          minLength: 1
        shareCode:
          type: string
          minLength: 1
      required:
      - shareCode
      - shareId
    ResultBoolean:
      type: object
      properties:
        data:
          type: boolean
        code:
          type: integer
          format: int32
        msg:
          type: string
    CreateShareCmd:
      type: object
      properties:
        fileIds:
          type: array
          items:
            type: string
          minItems: 1
        shareName:
          type: string
        expireType:
          type: integer
          format: int32
        expireTime:
          type: string
          format: date-time
        scope:
          type: string
        needShareCode:
          type: boolean
        maxViewCount:
          type: integer
          format: int32
        maxDownloadCount:
          type: integer
          format: int32
      required:
      - fileIds
    FileShareVO:
      type: object
      properties:
        id:
          type: string
        shareName:
          type: string
        shareCode:
          type: string
        expireTime:
          type: string
          format: date-time
        scope:
          type: string
        isPermanent:
          type: boolean
        viewCount:
          type: integer
          format: int32
        downloadCount:
          type: integer
          format: int32
        maxViewCount:
          type: integer
          format: int32
        maxDownloadCount:
          type: integer
          format: int32
        fileCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    ResultFileShareVO:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FileShareVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    FileVO:
      type: object
      properties:
        id:
          type: string
        objectKey:
          type: string
        originalName:
          type: string
        displayName:
          type: string
        suffix:
          type: string
        size:
          type: integer
          format: int64
        mimeType:
          type: string
        isDir:
          type: boolean
        parentId:
          type: string
        userId:
          type: string
        thumbnailUrl:
          type: string
        uploadTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
        lastAccessTime:
          type: string
          format: date-time
        isFavorite:
          type: boolean
    ResultListFileVO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    FileShareThinVO:
      type: object
      properties:
        id:
          type: string
        shareName:
          type: string
        expireTime:
          type: string
          format: date-time
        scope:
          type: string
        isExpire:
          type: boolean
        fileCount:
          type: integer
          format: int64
        hasCheckCode:
          type: boolean
    ResultFileShareThinVO:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FileShareThinVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    FileShareAccessRecordVO:
      type: object
      properties:
        id:
          type: string
        shareId:
          type: string
        accessIp:
          type: string
        accessAddress:
          type: string
        browser:
          type: string
        os:
          type: string
        accessTime:
          type: string
          format: date-time
    ResultListFileShareAccessRecordVO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileShareAccessRecordVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    FileShareQry:
      type: object
      properties:
        page:
          type: integer
          format: int32
          description: 页码
          example: 1
          minimum: 1
        pageSize:
          type: integer
          format: int32
          description: 每页大小
          example: 20
          minimum: 1
        orderBy:
          type: string
          description: 排序字段
          example: updateTime
        orderDirection:
          type: string
          description: 排序方向
          enum:
          - ASC
          - DESC
          example: DESC
        keyword:
          type: string
    PageRecordFileShareVO:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/FileShareVO'
        total:
          type: integer
          format: int64
    PageResultFileShareVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/PageRecordFileShareVO'
