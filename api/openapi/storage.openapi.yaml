openapi: 3.0.3
info:
  title: MyCloudDrive Storage API
  version: 1.0.0
  description: 存储域接口契约（spec-first）。
servers:
  - url: /
tags:
  - name: Storage
    description: 存储域接口契约（spec-first）。
paths:
  /apis/storage/settings:
    put:
      tags:
        - 存储平台管理
      summary: 新增存储平台配置
      operationId: saveOrUpdateStorageSetting_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageSettingEditCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultStorageSetting"
    post:
      tags:
        - 存储平台管理
      summary: 新增存储平台配置
      operationId: saveOrUpdateStorageSetting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageSettingAddCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultStorageSetting"
  /apis/storage/settings/{id}/{action}:
    post:
      tags:
        - 存储平台管理
      summary: 启用或禁用存储平台
      operationId: enableOrDisableStoragePlatform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultStorageSetting"
  /apis/storage/platforms:
    get:
      tags:
        - 存储平台管理
      summary: 获取存储平台列表
      operationId: getPlatforms
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListStoragePlatformVO"
  /apis/storage/platform/{identifier}:
    get:
      tags:
        - 存储平台管理
      summary: 根据标识符获取存储平台详情
      operationId: getStoragePlatformByIdentifier
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultStoragePlatform"
  /apis/storage/platform/settings:
    get:
      tags:
        - 存储平台管理
      summary: 获取用户存储平台配置列表
      operationId: getStorageSettingsByUser
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListStorageSettingUserVO"
  /apis/storage/active-platforms:
    get:
      tags:
        - 存储平台管理
      summary: 获取用户已启用存储平台列表
      operationId: getActiveStoragePlatforms
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListStorageActivePlatformsVO"
  /apis/storage/settings/{id}:
    delete:
      tags:
        - 存储平台管理
      summary: 删除存储平台配置
      operationId: saveOrUpdateStorageSetting_2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultStorageSetting"
components:
  schemas:
    StorageSettingEditCmd:
      type: object
      properties:
        settingId:
          type: string
          minLength: 1
        platformIdentifier:
          type: string
          minLength: 1
        configData:
          type: string
          minLength: 1
        remark:
          type: string
      required:
      - configData
      - platformIdentifier
      - settingId
    ResultStorageSetting:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/StorageSetting'
        code:
          type: integer
          format: int32
        msg:
          type: string
    StorageSetting:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        id:
          type: string
        platformIdentifier:
          type: string
        configData:
          type: string
        enabled:
          type: integer
          format: int32
        userId:
          type: string
        remark:
          type: string
        deleted:
          type: integer
          format: int32
    StorageSettingAddCmd:
      type: object
      properties:
        platformIdentifier:
          type: string
          minLength: 1
        configData:
          type: string
          minLength: 1
        remark:
          type: string
      required:
      - configData
      - platformIdentifier
    ResultListStoragePlatformVO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StoragePlatformVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    StoragePlatformVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        identifier:
          type: string
        configScheme:
          type: string
        icon:
          type: string
        link:
          type: string
        desc:
          type: string
        isDefault:
          type: integer
          format: int32
    ResultStoragePlatform:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/StoragePlatform'
        code:
          type: integer
          format: int32
        msg:
          type: string
    StoragePlatform:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        identifier:
          type: string
        configScheme:
          type: string
        icon:
          type: string
        link:
          type: string
        isDefault:
          type: integer
          format: int32
        desc:
          type: string
    ResultListStorageSettingUserVO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StorageSettingUserVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    StorageSettingUserVO:
      type: object
      properties:
        id:
          type: string
        storagePlatform:
          $ref: '#/components/schemas/StoragePlatformVO'
        configData:
          type: string
        enabled:
          type: integer
          format: int32
        userId:
          type: string
        remark:
          type: string
    ResultListStorageActivePlatformsVO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StorageActivePlatformsVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    StorageActivePlatformsVO:
      type: object
      properties:
        settingId:
          type: string
        platformIdentifier:
          type: string
        platformName:
          type: string
        platformIcon:
          type: string
        remark:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isEnabled:
          type: boolean
