openapi: 3.0.3
info:
  title: MyCloudDrive Storage API
  version: 1.0.0
  description: 存储域接口契约（spec-first）。
servers:
  - url: /
tags:
  - name: Storage
    description: 存储域接口契约（spec-first）。
paths:
  /apis/storage/settings:
    put:
      tags:
        - 存储平台管理
      summary: 新增存储平台配置
      operationId: saveOrUpdateStorageSetting_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/schemas/StorageSettingEditCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultStorageSetting"
    post:
      tags:
        - 存储平台管理
      summary: 新增存储平台配置
      operationId: saveOrUpdateStorageSetting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/schemas/StorageSettingAddCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultStorageSetting"
  /apis/storage/settings/{id}/{action}:
    post:
      tags:
        - 存储平台管理
      summary: 启用或禁用存储平台
      operationId: enableOrDisableStoragePlatform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultStorageSetting"
  /apis/storage/platforms:
    get:
      tags:
        - 存储平台管理
      summary: 获取存储平台列表
      operationId: getPlatforms
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultListStoragePlatformVO"
  /apis/storage/platform/{identifier}:
    get:
      tags:
        - 存储平台管理
      summary: 根据标识符获取存储平台详情
      operationId: getStoragePlatformByIdentifier
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultStoragePlatform"
  /apis/storage/platform/settings:
    get:
      tags:
        - 存储平台管理
      summary: 获取用户存储平台配置列表
      operationId: getStorageSettingsByUser
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultListStorageSettingUserVO"
  /apis/storage/active-platforms:
    get:
      tags:
        - 存储平台管理
      summary: 获取用户已启用存储平台列表
      operationId: getActiveStoragePlatforms
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultListStorageActivePlatformsVO"
  /apis/storage/settings/{id}:
    delete:
      tags:
        - 存储平台管理
      summary: 删除存储平台配置
      operationId: saveOrUpdateStorageSetting_2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultStorageSetting"
components:
  $ref: './components.yaml'
