openapi: 3.0.3
info:
  title: MyCloudDrive Storage API
  version: 1.0.0
  description: Storage 域接口契约（Go 风格命名）。
servers:
  - url: /
paths:
  /apis/storage/active-platforms:
    get:
      summary: 获取空间已启用存储平台
      operationId: listActivePlatforms
      tags: [Storage]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformListResponse'

  /apis/storage/platforms:
    get:
      summary: 获取存储平台列表
      operationId: listStoragePlatforms
      tags: [Storage]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformListResponse'

  /apis/storage/platform/{identifier}:
    get:
      summary: 根据标识符获取存储平台详情
      operationId: getStoragePlatformByIdentifier
      tags: [Storage]
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformResponse'

  /apis/storage/platform/settings:
    get:
      summary: 获取空间存储配置列表
      operationId: listStorageSettings
      tags: [Storage]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingListResponse'

  /apis/storage/settings:
    post:
      summary: 新增存储配置
      operationId: createStorageSetting
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'

  /apis/storage/settings/{settingId}:
    put:
      summary: 更新存储配置
      operationId: updateStorageSetting
      tags: [Storage]
      parameters:
        - name: settingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
    delete:
      summary: 删除存储配置
      operationId: deleteStorageSetting
      tags: [Storage]
      parameters:
        - name: settingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content

  /apis/storage/settings/{settingId}/activate:
    post:
      summary: 启用存储配置
      operationId: activateStorageSetting
      tags: [Storage]
      parameters:
        - name: settingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'

  /apis/storage/settings/{settingId}/{action}:
    post:
      summary: 启用或禁用存储配置（兼容 action）
      operationId: activateOrDisableStorageSettingByAction
      tags: [Storage]
      parameters:
        - name: settingId
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'

components:
  schemas:
    StoragePlatform:
      type: object
      properties:
        identifier:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        description:
          type: string
      required: [identifier, name, enabled]

    StorageSetting:
      type: object
      properties:
        id:
          type: string
        storageSettingName:
          type: string
        identifier:
          type: string
        active:
          type: boolean
        configJson:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [id, storageSettingName, identifier, active]

    CreateSettingRequest:
      type: object
      properties:
        storageSettingName:
          type: string
        identifier:
          type: string
        configJson:
          type: string
      required: [storageSettingName, identifier, configJson]

    UpdateSettingRequest:
      type: object
      properties:
        storageSettingName:
          type: string
        configJson:
          type: string
      required: [configJson]

    PlatformListResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/StoragePlatform'

    PlatformResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/StoragePlatform'

    SettingListResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/StorageSetting'

    SettingResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/StorageSetting'
