openapi: 3.0.1
info:
  title: MyCloudDrive File API
  description: 文件域接口契约（Go 风格命名）。
  version: 1.0.0
tags:
  - name: 文件管理
  - name: 文件管理/文件传输
  - name: 文件传输
  - name: 文件首页
paths:
  /apis/transfer/resume/{taskId}:
    post:
      summary: 继续传输
      deprecated: false
      description: ''
      operationId: resumeTransfer
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: taskId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
          headers: {}
      security: []
  /apis/transfer/pause/{taskId}:
    post:
      summary: 暂停传输
      deprecated: false
      description: ''
      operationId: pauseTransfer
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: taskId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
          headers: {}
      security: []
  /apis/transfer/merge/{taskId}:
    post:
      summary: 合并分片
      deprecated: false
      description: 所有分片上传完成后调用，合并分片并返回文件ID
      operationId: mergeChunks
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: taskId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultString'
          headers: {}
      security: []
  /apis/transfer/init:
    post:
      summary: 初始化文件上传
      deprecated: false
      description: 初始化上传环境，返回taskId用于后续分片上传
      operationId: initUpload
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitUploadRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultString'
          headers: {}
      security: []
  /apis/transfer/init-download:
    post:
      summary: 初始化下载任务
      deprecated: false
      description: 创建下载任务并返回任务信息
      operationId: initDownload
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitDownloadRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultInitDownloadResultResponse'
          headers: {}
      security: []
  /apis/transfer/chunk:
    post:
      summary: 上传分片
      deprecated: false
      description: 异步上传分片，立即返回，通过SSE推送进度
      operationId: uploadChunk
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: taskId
          in: query
          description: ''
          required: true
          schema:
            type: string
        - name: chunkIndex
          in: query
          description: ''
          required: true
          schema:
            type: integer
            format: int32
        - name: chunkMd5
          in: query
          description: ''
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultObject'
          headers: {}
      security: []
  /apis/transfer/check:
    post:
      summary: 校验文件
      deprecated: false
      description: 前端计算完MD5后调用，判断是否秒传
      operationId: checkUpload
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUploadRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultCheckUploadResultResponse'
          headers: {}
      security: []
  /apis/transfer/sse:
    get:
      summary: 建立SSE连接
      deprecated: false
      description: 建立SSE连接以接收实时传输事件
      operationId: subscribe
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: userId
          in: query
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SseEmitter'
          headers: {}
      security: []
  /apis/transfer/files:
    get:
      summary: 获取传输列表
      deprecated: false
      description: 获取传输列表
      operationId: getTransferFiles
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: statusType
          in: query
          description: ''
          required: false
          example: 0
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultListFileTransferTaskResponse'
          headers: {}
      security: []
  /apis/transfer/download/{fileId}:
    get:
      summary: 下载文件
      deprecated: false
      description: 根据文件ID下载文件
      operationId: downloadFile
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: fileId
          in: path
          description: 文件ID
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
          headers: {}
      security: []
  /apis/transfer/download/chunks/{taskId}:
    get:
      summary: 查询已下载分片
      deprecated: false
      description: 获取已下载的分片索引列表
      operationId: getDownloadedChunks
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: taskId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultSetInteger'
          headers: {}
      security: []
  /apis/transfer/download/chunk:
    get:
      summary: 下载分片
      deprecated: false
      description: 下载指定分片，返回206 Partial Content
      operationId: downloadChunk
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: taskId
          in: query
          description: 任务ID
          required: true
          example: task123
          schema:
            type: string
            description: 任务ID
            minLength: 1
            example: task123
        - name: chunkIndex
          in: query
          description: 分片索引（从0开始）
          required: true
          example: 0
          schema:
            type: integer
            format: int32
            description: 分片索引（从0开始）
            minimum: 0
            example: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StreamingResponseBody'
          headers: {}
      security: []
  /apis/transfer/chunks/{taskId}:
    get:
      summary: 查询已上传的分片
      deprecated: false
      description: 用于断点续传，返回已上传的分片索引列表
      operationId: getUploadedChunks
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: taskId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultSetInteger'
          headers: {}
      security: []
  /apis/transfer/clears:
    delete:
      summary: 清空已完成的传输列表
      deprecated: false
      description: 清空已完成的传输列表
      operationId: clearTransfers
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultSetInteger'
          headers: {}
      security: []
  /apis/transfer/cancel/{taskId}:
    delete:
      summary: 取消传输
      deprecated: false
      description: ''
      operationId: cancelUpload
      tags:
        - 文件管理/文件传输
        - 文件传输
      parameters:
        - name: taskId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
          headers: {}
      security: []
  /apis/home/info:
    get:
      summary: 查询首页信息
      deprecated: false
      description: 查询首页信息
      operationId: getHomes
      tags:
        - 文件管理
        - 文件首页
      parameters:
        - name: unit
          in: query
          description: 单位，1:KB, 2:MB, 3:GB
          required: false
          example: 0
          schema:
            type: integer
            format: int32
            description: 单位，1:KB, 2:MB, 3:GB
        - name: dateType
          in: query
          description: 日期类型, 0:近三个月, 1:近30天, 2:近7天
          required: false
          example: 0
          schema:
            type: integer
            format: int32
            description: 日期类型, 0:近三个月, 1:近30天, 2:近7天
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileHomeResponse'
          headers: {}
      security: []
  /apis/file/{fileId}/rename:
    put:
      summary: 文件重命名
      deprecated: false
      description: 文件重命名
      operationId: renameFile
      tags:
        - 文件管理
      parameters:
        - name: fileId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameFileReq'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultObject'
          headers: {}
      security: []
  /apis/file/recycles:
    put:
      summary: 恢复文件
      deprecated: false
      description: 从回收站批量恢复文件
      operationId: restoreFile
      tags:
        - 文件管理
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultObject'
          headers: {}
      security: []
    delete:
      summary: 永久删除文件
      deprecated: false
      description: 永久删除文件，不可恢复
      operationId: permanentlyDeleteFiles
      tags:
        - 文件管理
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultObject'
          headers: {}
      security: []
  /apis/file/moves:
    put:
      summary: 文件移动
      deprecated: false
      description: 文件移动
      operationId: moveFile
      tags:
        - 文件管理
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveFileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultObject'
          headers: {}
      security: []
  /apis/file/favorites:
    post:
      summary: 收藏文件
      deprecated: false
      description: 收藏文件
      operationId: favoritesFile
      tags:
        - 文件管理
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultObject'
          headers: {}
      security: []
    delete:
      summary: 取消收藏文件
      deprecated: false
      description: 取消收藏文件
      operationId: unFavoritesFile
      tags:
        - 文件管理
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultObject'
          headers: {}
      security: []
  /apis/file/directory:
    post:
      summary: 创建目录
      deprecated: false
      description: 在指定目录下创建新目录
      operationId: createDirectory
      tags:
        - 文件管理
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileInfo'
          headers: {}
      security: []
  /apis/file/{fileId}:
    get:
      summary: 查询文件详情
      deprecated: false
      description: 查询文件详情
      operationId: getFileDetails
      tags:
        - 文件管理
      parameters:
        - name: fileId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileDetailResponse'
          headers: {}
      security: []
  /apis/file/url/{fileId}:
    get:
      summary: 获取文件URL
      deprecated: false
      description: 获取文件的访问URL
      operationId: getFileUrl
      tags:
        - 文件管理
      parameters:
        - name: fileId
          in: path
          description: 文件ID
          required: true
          example: ''
          schema:
            type: string
        - name: expireSeconds
          in: query
          description: URL有效时间（秒），如果不支持或永久有效可为null
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultString'
          headers: {}
      security: []
  /apis/file/recycle/pages:
    get:
      summary: 分页获取回收站列表
      deprecated: false
      description: 分页获取回收站列表
      operationId: getRecyclePages
      tags:
        - 文件管理
      parameters:
        - name: page
          in: query
          description: 页码
          required: false
          example: 1
          schema:
            type: integer
            format: int32
            description: 页码
            minimum: 1
            example: 1
        - name: pageSize
          in: query
          description: 每页大小
          required: false
          example: 20
          schema:
            type: integer
            format: int32
            description: 每页大小
            minimum: 1
            example: 20
        - name: orderBy
          in: query
          description: 排序字段
          required: false
          example: updateTime
          schema:
            type: string
            description: 排序字段
            example: updateTime
        - name: orderDirection
          in: query
          description: 排序方向
          required: false
          example: DESC
          schema:
            type: string
            description: 排序方向
            enum:
              - ASC
              - DESC
            example: DESC
        - name: keyword
          in: query
          description: ''
          required: false
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResultObject'
          headers: {}
      security: []
  /apis/file/list:
    get:
      summary: 查询所有文件列表
      deprecated: false
      description: 支持关键词搜索和文件类型筛选的列表查询
      operationId: getList
      tags:
        - 文件管理
      parameters:
        - name: page
          in: query
          description: 页码
          required: false
          example: 1
          schema:
            type: integer
            format: int32
            description: 页码
            minimum: 1
            example: 1
        - name: pageSize
          in: query
          description: 每页大小
          required: false
          example: 20
          schema:
            type: integer
            format: int32
            description: 每页大小
            minimum: 1
            example: 20
        - name: orderBy
          in: query
          description: 排序字段
          required: false
          example: updateTime
          schema:
            type: string
            description: 排序字段
            example: updateTime
        - name: orderDirection
          in: query
          description: 排序方向
          required: false
          example: DESC
          schema:
            type: string
            description: 排序方向
            enum:
              - ASC
              - DESC
            example: DESC
        - name: parentId
          in: query
          description: 父目录ID（空表示根目录）
          required: false
          example: '123'
          schema:
            type: string
            description: 父目录ID（空表示根目录）
            example: '123'
        - name: keyword
          in: query
          description: 文件名关键词（搜索用）
          required: false
          example: 工作文档
          schema:
            type: string
            description: 文件名关键词（搜索用）
            example: 工作文档
        - name: fileType
          in: query
          description: 文件类型过滤
          required: false
          example: IMAGE
          schema:
            type: string
            description: 文件类型过滤
            enum:
              - ALL
              - DOCUMENT
              - IMAGE
              - VIDEO
              - AUDIO
              - OTHER
            example: IMAGE
        - name: isFavorite
          in: query
          description: 是否收藏
          required: false
          example: 'true'
          schema:
            type: boolean
            description: 是否收藏
            example: true
        - name: isRecents
          in: query
          description: 最近使用
          required: false
          example: 'true'
          schema:
            type: boolean
            description: 最近使用
            example: true
        - name: isDir
          in: query
          description: 是否目录
          required: false
          example: 'true'
          schema:
            type: boolean
            description: 是否目录
            example: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResultFileResponse'
          headers: {}
      security: []
  /apis/file/dirs:
    get:
      summary: 查询目录列表
      deprecated: false
      description: 查询目录列表
      operationId: getDirs
      tags:
        - 文件管理
      parameters:
        - name: parentId
          in: query
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultListFileResponse'
          headers: {}
      security: []
  /apis/file/directory/{dirId}/path:
    get:
      summary: 获取目录层级
      deprecated: false
      description: 根据目录ID获取目录层级
      operationId: getDirectoryPath
      tags:
        - 文件管理
      parameters:
        - name: dirId
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultListFileResponse'
          headers: {}
      security: []
  /apis/file:
    delete:
      summary: 移到回收站
      deprecated: false
      description: 将文件移动到回收站
      operationId: deleteFiles
      tags:
        - 文件管理
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultObject'
          headers: {}
      security: []
  /apis/file/recycles/clear:
    delete:
      summary: 清空回收站
      deprecated: false
      description: 清空回收站，永久删除所有文件
      operationId: clearRecycles
      tags:
        - 文件管理
      parameters: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultObject'
          headers: {}
      security: []
components:
  schemas:
    ResultObject: &ref_0
      type: object
      properties:
        data: {}
        code:
          type: integer
          format: int32
        msg:
          type: string
    RenameFileReq:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
      required:
        - displayName
    MoveFileRequest:
      type: object
      properties:
        dirId:
          type: string
        fileIds:
          type: array
          items:
            type: string
          minItems: 1
      required:
        - fileIds
    ResultVoid: *ref_0
    ResultString:
      type: object
      properties:
        data:
          type: string
        code:
          type: integer
          format: int32
        msg:
          type: string
    InitUploadRequest:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
        fileSize:
          type: integer
          format: int64
        parentId:
          type: string
        totalChunks:
          type: integer
          format: int32
        chunkSize:
          type: integer
          format: int64
        mimeType:
          type: string
          minLength: 1
      required:
        - chunkSize
        - fileName
        - fileSize
        - mimeType
        - totalChunks
    CreateDirectoryRequest:
      type: object
      properties:
        folderName:
          type: string
