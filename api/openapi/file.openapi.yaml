openapi: 3.0.3
info:
  title: MyCloudDrive File API
  version: 1.0.0
  description: 文件域接口契约（spec-first）。
servers:
  - url: /
tags:
  - name: File
    description: 文件域接口契约（spec-first）。
paths:
  /apis/home/info:
    get:
      tags:
        - 文件首页
      summary: 查询首页信息
      description: 查询首页信息
      operationId: getHomes
      parameters:
        - name: qry
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FileHomeUsedBytesQry"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultFileHomeVO"
  /apis/file/{fileId}/rename:
    put:
      tags:
        - 文件管理
      summary: 文件重命名
      description: 文件重命名
      operationId: createDirectory
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameFileCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultObject"
  /apis/file/recycles:
    put:
      tags:
        - 文件管理
      summary: 恢复文件
      description: 从回收站批量恢复文件
      operationId: restoreFile
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultObject"
    delete:
      tags:
        - 文件管理
      summary: 永久删除文件
      description: 永久删除文件，不可恢复
      operationId: permanentlyDeleteFiles
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultObject"
  /apis/file/moves:
    put:
      tags:
        - 文件管理
      summary: 文件移动
      description: 文件移动
      operationId: createDirectory_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFileCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultObject"
  /preview/token/{fileId}:
    post:
      tags:
        - file-preview-controller
      operationId: previewToken
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultString"
  /archive/preview/token/{archiveFileId}:
    post:
      tags:
        - archive-preview-controller
      operationId: previewToken_1
      parameters:
        - name: archiveFileId
          in: path
          required: true
          schema:
            type: string
        - name: innerPath
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultString"
  /apis/file/favorites:
    post:
      tags:
        - 文件管理
      summary: 收藏文件
      description: 收藏文件
      operationId: favoritesFile
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultObject"
    delete:
      tags:
        - 文件管理
      summary: 取消收藏文件
      description: 取消收藏文件
      operationId: unFavoritesFile
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultObject"
  /apis/file/directory:
    post:
      tags:
        - 文件管理
      summary: 创建目录
      description: 在指定目录下创建新目录
      operationId: createDirectory_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectoryCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultFileInfo"
  /apis/file/{fileId}:
    get:
      tags:
        - 文件管理
      summary: 查询文件详情
      description: 查询文件详情
      operationId: getFileDetails
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultFileDetailVO"
  /apis/file/url/{fileId}:
    get:
      tags:
        - 文件管理
      summary: 获取文件URL
      description: 获取文件的访问URL
      operationId: getFileUrl
      parameters:
        - name: fileId
          in: path
          description: 文件ID
          required: true
          schema:
            type: string
        - name: expireSeconds
          in: query
          description: URL有效时间（秒），如果不支持或永久有效可为null
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultString"
  /apis/file/recycle/pages:
    get:
      tags:
        - 文件管理
      summary: 分页获取回收站列表
      description: 分页获取回收站列表
      operationId: getRecyclePages
      parameters:
        - name: qry
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FileRecycleQry"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultObject"
  /apis/file/list:
    get:
      tags:
        - 文件管理
      summary: 查询所有文件列表
      description: 支持关键词搜索和文件类型筛选的列表查询
      operationId: getList
      parameters:
        - name: qry
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FileQry"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResultFileVO"
  /apis/file/dirs:
    get:
      tags:
        - 文件管理
      summary: 查询目录列表
      description: 查询目录列表
      operationId: getDirs
      parameters:
        - name: parentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListFileVO"
  /apis/file/directory/{dirId}/path:
    get:
      tags:
        - 文件管理
      summary: 获取目录层级
      description: 根据目录ID获取目录层级
      operationId: createDirectory_4
      parameters:
        - name: dirId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultListFileVO"
  /api/file/stream/preview/{fileId}:
    get:
      tags:
        - file-stream-controller
      operationId: preview
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StreamingResponseBody"
  /api/file/stream/preview/archive/inner/{tempId}:
    get:
      tags:
        - file-stream-controller
      operationId: previewArchiveInner
      parameters:
        - name: tempId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StreamingResponseBody"
  /apis/file:
    delete:
      tags:
        - 文件管理
      summary: 移到回收站
      description: 将文件移动到回收站
      operationId: deleteFiles
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultObject"
  /apis/file/recycles/clear:
    delete:
      tags:
        - 文件管理
      summary: 清空回收站
      description: 清空回收站，永久删除所有文件
      operationId: clearRecycles
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultObject"
components:
  schemas:
    ResultObject:
      type: object
      properties:
        data: {}
        code:
          type: integer
          format: int32
        msg:
          type: string
    RenameFileCmd:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
      required:
      - displayName
    MoveFileCmd:
      type: object
      properties:
        dirId:
          type: string
        fileIds:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - fileIds
    ResultString:
      type: object
      properties:
        data:
          type: string
        code:
          type: integer
          format: int32
        msg:
          type: string
    CreateDirectoryCmd:
      type: object
      properties:
        folderName:
          type: string
          minLength: 1
          title: 目录名称
        parentId:
          type: string
          title: 父目录ID
      required:
      - folderName
    FileInfo:
      type: object
      properties:
        id:
          type: string
        objectKey:
          type: string
        originalName:
          type: string
        displayName:
          type: string
        suffix:
          type: string
        size:
          type: integer
          format: int64
        mimeType:
          type: string
        isDir:
          type: boolean
        parentId:
          type: string
        userId:
          type: string
        contentMd5:
          type: string
        storagePlatformSettingId:
          type: string
        uploadTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
        lastAccessTime:
          type: string
          format: date-time
        isDeleted:
          type: boolean
        deletedTime:
          type: string
          format: date-time
    ResultFileInfo:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FileInfo'
        code:
          type: integer
          format: int32
        msg:
          type: string
    StreamingResponseBody: {}
    FileVO:
      type: object
      properties:
        id:
          type: string
        objectKey:
          type: string
        originalName:
          type: string
        displayName:
          type: string
        suffix:
          type: string
        size:
          type: integer
          format: int64
        mimeType:
          type: string
        isDir:
          type: boolean
        parentId:
          type: string
        userId:
          type: string
        thumbnailUrl:
          type: string
        uploadTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time
        lastAccessTime:
          type: string
          format: date-time
        isFavorite:
          type: boolean
    ResultListFileVO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    FileHomeUsedBytesQry:
      type: object
      description: 首页存储增长查询条件
      properties:
        unit:
          type: integer
          format: int32
          description: 单位，1:KB, 2:MB, 3:GB
        dateType:
          type: integer
          format: int32
          description: 日期类型, 0:近三个月, 1:近30天, 2:近7天
    FileHomeUsedBytesVO:
      type: object
      properties:
        date:
          type: string
        usedBytes:
          type: number
          format: double
    FileHomeVO:
      type: object
      properties:
        usedStorage:
          type: number
          format: double
        usedBytes:
          type: array
          items:
            $ref: '#/components/schemas/FileHomeUsedBytesVO'
        recentFiles:
          type: array
          items:
            $ref: '#/components/schemas/FileVO'
        unit:
          type: string
    ResultFileHomeVO:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FileHomeVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    FileDetailVO:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        suffix:
          type: string
        size:
          type: integer
          format: int64
        includeFiles:
          type: integer
          format: int32
        includeFolders:
          type: integer
          format: int32
        isDir:
          type: boolean
        thumbnailUrl:
          type: string
        uploadTime:
          type: string
          format: date-time
        lastAccessTime:
          type: string
          format: date-time
    ResultFileDetailVO:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FileDetailVO'
        code:
          type: integer
          format: int32
        msg:
          type: string
    FileRecycleQry:
      type: object
      properties:
        page:
          type: integer
          format: int32
          description: 页码
          example: 1
          minimum: 1
        pageSize:
          type: integer
          format: int32
          description: 每页大小
          example: 20
          minimum: 1
        orderBy:
          type: string
          description: 排序字段
          example: updateTime
        orderDirection:
          type: string
          description: 排序方向
          enum:
          - ASC
          - DESC
          example: DESC
        keyword:
          type: string
    PageRecordObject:
      type: object
      properties:
        records:
          type: array
          items: {}
        total:
          type: integer
          format: int64
    PageResultObject:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/PageRecordObject'
    FileQry:
      type: object
      description: 文件列表查询参数
      properties:
        page:
          type: integer
          format: int32
          description: 页码
          example: 1
          minimum: 1
        pageSize:
          type: integer
          format: int32
          description: 每页大小
          example: 20
          minimum: 1
        orderBy:
          type: string
          description: 排序字段
          example: updateTime
        orderDirection:
          type: string
          description: 排序方向
          enum:
          - ASC
          - DESC
          example: DESC
        parentId:
          type: string
          description: 父目录ID（空表示根目录）
          example: '123'
        keyword:
          type: string
          description: 文件名关键词（搜索用）
          example: 工作文档
        fileType:
          type: string
          description: 文件类型过滤
          enum:
          - ALL
          - DOCUMENT
          - IMAGE
          - VIDEO
          - AUDIO
          - OTHER
          example: IMAGE
        isFavorite:
          type: boolean
          description: 是否收藏
          example: true
        isRecents:
          type: boolean
          description: 最近使用
          example: true
        isDir:
          type: boolean
          description: 是否目录
          example: true
    PageRecordFileVO:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/FileVO'
        total:
          type: integer
          format: int64
    PageResultFileVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/PageRecordFileVO'
