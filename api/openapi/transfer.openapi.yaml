openapi: 3.0.3
info:
  title: MyCloudDrive Transfer API
  version: 1.0.0
  description: 传输域接口契约（spec-first）。
servers:
  - url: /
tags:
  - name: Transfer
    description: 传输域接口契约（spec-first）。
paths:
  /apis/transfer/resume/{taskId}:
    post:
      tags:
        - 文件传输
      summary: 继续传输
      operationId: resumeTransfer
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultVoid"
  /apis/transfer/pause/{taskId}:
    post:
      tags:
        - 文件传输
      summary: 暂停传输
      operationId: pauseTransfer
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultVoid"
  /apis/transfer/merge/{taskId}:
    post:
      tags:
        - 文件传输
      summary: 合并分片
      description: 所有分片上传完成后调用，合并分片并返回文件ID
      operationId: mergeChunks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultString"
  /apis/transfer/init:
    post:
      tags:
        - 文件传输
      summary: 初始化文件上传
      description: 初始化上传环境，返回taskId用于后续分片上传
      operationId: initUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/schemas/InitUploadCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultString"
  /apis/transfer/init-download:
    post:
      tags:
        - 文件传输
      summary: 初始化下载任务
      description: 创建下载任务并返回任务信息
      operationId: initDownload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/schemas/InitDownloadCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultInitDownloadResultVO"
  /apis/transfer/chunk:
    post:
      tags:
        - 文件传输
      summary: 上传分片
      description: 异步上传分片，立即返回，通过SSE推送进度
      operationId: uploadChunk
      parameters:
        - name: taskId
          in: query
          required: true
          schema:
            type: string
        - name: chunkIndex
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: chunkMd5
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultObject"
  /apis/transfer/check:
    post:
      tags:
        - 文件传输
      summary: 校验文件
      description: 前端计算完MD5后调用，判断是否秒传
      operationId: checkUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/schemas/CheckUploadCmd"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultCheckUploadResultVO"
  /apis/transfer/sse:
    get:
      tags:
        - 文件传输
      summary: 建立SSE连接
      description: 建立SSE连接以接收实时传输事件
      operationId: subscribe
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/SseEmitter"
  /apis/transfer/files:
    get:
      tags:
        - 文件传输
      summary: 获取传输列表
      description: 获取传输列表
      operationId: getTransferFiles
      parameters:
        - name: qry
          in: query
          required: true
          schema:
            $ref: "./components.yaml#/schemas/TransferFilesQry"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultListFileTransferTaskVO"
  /apis/transfer/download/{fileId}:
    get:
      tags:
        - 文件传输
      summary: 下载文件
      description: 根据文件ID下载文件
      operationId: downloadFile
      parameters:
        - name: fileId
          in: path
          description: 文件ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /apis/transfer/download/chunks/{taskId}:
    get:
      tags:
        - 文件传输
      summary: 查询已下载分片
      description: 获取已下载的分片索引列表
      operationId: getDownloadedChunks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultSetInteger"
  /apis/transfer/download/chunk:
    get:
      tags:
        - 文件传输
      summary: 下载分片
      description: 下载指定分片，返回206 Partial Content
      operationId: downloadChunk
      parameters:
        - name: qry
          in: query
          required: true
          schema:
            $ref: "./components.yaml#/schemas/DownloadChunkQry"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/StreamingResponseBody"
  /apis/transfer/chunks/{taskId}:
    get:
      tags:
        - 文件传输
      summary: 查询已上传的分片
      description: 用于断点续传，返回已上传的分片索引列表
      operationId: getUploadedChunks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultSetInteger"
  /apis/transfer/clears:
    delete:
      tags:
        - 文件传输
      summary: 清空已完成的传输列表
      description: 清空已完成的传输列表
      operationId: clearTransfers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultSetInteger"
  /apis/transfer/cancel/{taskId}:
    delete:
      tags:
        - 文件传输
      summary: 取消传输
      operationId: cancelUpload
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "./components.yaml#/schemas/ResultVoid"
components:
  $ref: './components.yaml'
