app_name: myclouddrive-go
http:
  addr: ":8080"
database:
  dsn: "myclouddrive:myclouddrive@tcp(127.0.0.1:3306)/myclouddrive?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime_min: 30
redis:
  username: ""
  addr: "127.0.0.1:6379"
  db: 0
llm:
  provider: "deepseek"
  base_url: "https://api.deepseek.com"
  api_key: "<YOUR_DEEPSEEK_API_KEY>"
  model: "deepseek-chat"
  timeout_ms: 8000
embedding:
  provider: "dashscope"
  base_url: "https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding"
  api_key: "<YOUR_EMBEDDING_API_KEY>"
  model: "text-embedding-v4"
  timeout_ms: 8000
  dims: 1024
